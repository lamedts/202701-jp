<script>
(() => {
  const form = document.getElementById('unlock-form');
  const input = document.getElementById('password');
  const button = document.getElementById('unlock');
  const error = document.getElementById('unlock-error');
  const reveal = document.getElementById('reveal');
  const decode = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
  reveal.addEventListener('click', () => {
    const showing = input.type === 'password';
    input.type = showing ? 'text' : 'password';
    reveal.textContent = showing ? '隱藏' : '顯示';
    reveal.setAttribute('aria-pressed', String(showing));
  });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (button.disabled) return;
    error.textContent = '';
    input.removeAttribute('aria-invalid');
    if (!globalThis.crypto?.subtle) {
      error.textContent = '此瀏覽器未支援解密，請以新版瀏覽器透過 HTTPS 開啟。';
      return;
    }
    button.disabled = true;
    button.textContent = '開啟中…';
    let html;
    try {
      const payload = JSON.parse(document.getElementById('encrypted-itinerary').textContent);
      const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(input.value), 'PBKDF2', false, ['deriveKey']);
      input.value = '';
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: decode(payload.salt), iterations: payload.iterations, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: decode(payload.iv) }, key, decode(payload.ciphertext)));
    } catch {
      error.textContent = '密碼唔啱，請再試一次。';
      input.setAttribute('aria-invalid', 'true');
      input.focus();
      button.disabled = false;
      button.textContent = '開啟旅程 →';
      return;
    }
    document.open();
    document.write(html);
    document.close();
    requestAnimationFrame(() => {
      const target = document.getElementById(location.hash.slice(1));
      if (target) target.scrollIntoView();
    });
  });
})();
</script>
